name: Detection improvement
description: Suggest a new framework, library, token pattern, lifecycle stage, or evidence type.
title: "Detection: "
labels: ["enhancement", "detection"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep examples sanitized. SessionScope is for defensive, authorized analysis only.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cookie evidence
        - JWT evidence
        - Session middleware
        - Refresh token lifecycle
        - Logout or revocation evidence
        - Password reset or email verification tokens
        - API keys or opaque bearer tokens
        - Trust-boundary or scope evidence
        - Reporting
    validations:
      required: true
  - type: input
    id: framework
    attributes:
      label: Framework or library
      placeholder: "Express, Next.js, FastAPI, Django, jsonwebtoken, jose, PyJWT"
    validations:
      required: true
  - type: textarea
    id: pattern
    attributes:
      label: Sanitized pattern
      description: Show the smallest safe example that demonstrates the pattern.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected SessionScope output
      placeholder: "Artifact, lifecycle evidence, finding, reviewer question, diagnostic, or report behavior."
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why this is token lifecycle evidence
    validations:
      required: false

