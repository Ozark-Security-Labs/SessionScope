[package]
name = "sessionscope-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sessionscope"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
sessionscope-classifier = { path = "../sessionscope-classifier" }
sessionscope-core = { path = "../sessionscope-core" }
sessionscope-detectors = { path = "../sessionscope-detectors" }
sessionscope-reporters = { path = "../sessionscope-reporters" }
toml = "1.1.2"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.27.0"

[lints]
workspace = true
